# NomadTTY — nginx virtual host for terminal.yourdomain.com
# Reverse-proxies the Node Session Manager (server/session-manager.js),
# which itself owns per-session ttyd processes, the Session Manager UI,
# and toolbar (kb.js) injection.
#
# Usage:
#   sudo cp nginx/ttyd.conf /etc/nginx/sites-available/nomadtty
#   sudo ln -s /etc/nginx/sites-available/nomadtty /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name terminal.yourdomain.com;   # <-- change this

    access_log /var/log/nginx/nomadtty.access.log;
    error_log  /var/log/nginx/nomadtty.error.log;

    # Everything (Session Manager UI, /api/*, /term/<id>/*, and WebSocket
    # upgrades for reconnecting to a specific session) is handled by the
    # Node session-manager process. See server/session-manager.js.
    location / {
        proxy_pass            http://127.0.0.1:4000;
        proxy_http_version    1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
