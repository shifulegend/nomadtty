# NomadTTY — nginx virtual host for terminal.yourdomain.com
# Reverse-proxies the Node Session Manager (server/session-manager.js),
# which itself owns per-session ttyd processes, the Session Manager UI,
# and toolbar (kb.js) injection.
#
# Usage:
#   sudo cp nginx/ttyd.conf /etc/nginx/sites-available/nomadtty
#   sudo ln -s /etc/nginx/sites-available/nomadtty /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# install.sh sets this up for you automatically (including HTTPS via
# NOMADTTY_TLS=certbot and Basic Auth via NOMADTTY_BASIC_AUTH — see its
# header comment). Manual/Docker users get this file as-is: HTTP only, no
# extra auth layer, with a conservative default rate limit (see below).

# Rate-limits the terminal endpoint per client IP — a Medium-priority
# hardening recommendation from SECURITY.md, on by default rather than left
# entirely to the operator. 10r/s with a burst of 20 comfortably covers
# normal interactive use (keystrokes, MCP polling) while blunting a basic
# brute-force/DoS attempt. Remove this line (and the `limit_req` line below)
# if your workload needs a higher steady-state rate.
limit_req_zone $binary_remote_addr zone=nomadtty:10m rate=10r/s;

server {
    listen 80;
    server_name terminal.yourdomain.com;   # <-- change this

    access_log /var/log/nginx/nomadtty.access.log;
    error_log  /var/log/nginx/nomadtty.error.log;

    # Everything (Session Manager UI, /api/*, /term/<id>/*, and WebSocket
    # upgrades for reconnecting to a specific session) is handled by the
    # Node session-manager process. See server/session-manager.js.
    location / {
        limit_req zone=nomadtty burst=20 nodelay;

        proxy_pass            http://127.0.0.1:4000;
        proxy_http_version    1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
