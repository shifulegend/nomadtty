name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint install.sh
        run: shellcheck install.sh
      - name: Lint docker-entrypoint.sh
        run: shellcheck docker-entrypoint.sh

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nginx-config:
    name: nginx config syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nginx
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx
      - name: Validate nginx/ttyd.conf
        run: |
          sudo cp nginx/ttyd.conf /etc/nginx/sites-available/nomadtty
          sudo ln -sf /etc/nginx/sites-available/nomadtty /etc/nginx/sites-enabled/nomadtty
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

  playwright:
    name: Playwright (Session Manager + MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ttyd/tmux
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ttyd tmux
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
