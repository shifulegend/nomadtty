<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>NomadTTY — Session Manager</title>
  <meta name="description" content="NomadTTY — a mobile-friendly persistent web terminal with a touch keyboard toolbar. Manage terminal sessions from any phone, tablet, or desktop browser.">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Private, authenticated tool -- not meant to be search-indexed; see public/robots.txt. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph / Twitter Card: for link-preview unfurling (e.g. sharing a
       session URL in Slack/email), independent of the noindex directive
       above, which only concerns search-engine crawlers, not link-preview
       bots. No og:url: this static file has no single canonical URL across
       deployments (Tailscale hostname, custom domain, etc.) — see
       docs/ai/engineering-rules.md's no-hardcoding rule. -->
  <meta property="og:title" content="NomadTTY — Session Manager">
  <meta property="og:description" content="A mobile-friendly persistent web terminal with a touch keyboard toolbar.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="NomadTTY — Session Manager">
  <meta name="twitter:description" content="A mobile-friendly persistent web terminal with a touch keyboard toolbar.">
  <meta name="twitter:image" content="/icon-512.png">

  <!-- Favicons + mobile "Add to Home Screen" branding -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="mask-icon" href="/favicon.svg" color="#0052cc">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NomadTTY">
  <style>
    /* ── DESIGN.md compliance ──
       Monospace only, near-black background, single blue accent,
       34-38px touch targets, no gradients/shadows beyond subtle elevation. */
    html,body{margin:0;height:100%;background:#0b0b0c;color:#ccc;
      font-family:monospace;overflow-y:auto;-webkit-user-select:none;}
    #sm-root{max-width:480px;margin:0 auto;padding:20px 16px;
      padding-top:calc(20px + env(safe-area-inset-top));
      /* Reserves space for the fixed #sm-footer below (its own rendered
         height is ~35px) so the last session row can scroll fully clear
         of it instead of being covered -- same footprint-reservation
         pattern src/kb.js uses for #back-btn vs. the scrollable toolbar
         row. See docs/ai/mistakes.md 2026-07-29-017. */
      padding-bottom:calc(50px + env(safe-area-inset-bottom));
      box-sizing:border-box;}
    #sm-brand{display:flex;align-items:center;gap:6px;margin-bottom:16px;}
    #sm-brand img{width:20px;height:20px;display:block;}
    #sm-brand span{font-size:13px;color:#7fb8ff;}
    h1{font-size:18px;color:#fff;margin:0 0 4px;}
    .sub{font-size:13px;color:#888;margin:0 0 20px;}
    #new-session-btn{width:100%;background:#0052cc;color:#fff;
      border:1px solid #0077ff;border-radius:6px;padding:12px;
      font:13px/1 monospace;cursor:pointer;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;margin-bottom:20px;}
    #new-session-btn:active{background:#0077ff;}
    #list-status{font-size:12px;color:#666;margin-bottom:10px;}
    .session-row{display:flex;align-items:center;gap:8px;
      background:#141414;border:1px solid #262626;border-radius:8px;
      padding:10px 12px;margin-bottom:8px;}
    .session-info{flex:1;min-width:0;}
    .session-label{color:#fff;font-size:13px;margin:0 0 2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .session-meta{font-size:11px;color:#777;}
    .session-actions{display:flex;gap:6px;flex:0 0 auto;}
    .sm-btn{min-width:34px;min-height:34px;border-radius:6px;
      font:11px/1 monospace;border:1px solid #333;background:#1e1e1e;
      color:#ccc;cursor:pointer;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;padding:0 10px;}
    .sm-btn.join{border-color:#0077ff;color:#7fb8ff;}
    .sm-btn.join:active{background:#005fcc;color:#fff;}
    .sm-btn.close{border-color:#552222;color:#e08787;}
    .sm-btn.close:active{background:#7a1f1f;color:#fff;}
    #empty-state{font-size:13px;color:#666;text-align:center;padding:30px 0;}
    /* Fixed to the true bottom of the screen at all times (never scrolls
       with the list), matching the same position:fixed overlay pattern
       #kb/#back-btn already use elsewhere in this app. */
    #sm-footer{position:fixed;left:0;right:0;bottom:0;z-index:10;
      max-width:480px;margin:0 auto;box-sizing:border-box;
      background:#0b0b0c;border-top:1px solid #1c1c1c;
      font-size:11px;color:#555;text-align:center;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  </style>
</head>
<body>
  <div id="sm-root">
    <div id="sm-brand"><img src="/favicon.svg" width="20" height="20" alt=""><span>NomadTTY</span></div>
    <h1>Session Manager</h1>
    <p class="sub">Open terminal sessions persist in the background.</p>
    <button id="new-session-btn">+ Create New Session</button>
    <div id="list-status">Loading sessions&hellip;</div>
    <div id="session-list"></div>
    <div id="empty-state" style="display:none">No open sessions. Create one to get started.</div>
    <div id="sm-footer">&copy; 2026 shifulegend &mdash; NomadTTY</div>
  </div>
  <script src="/session-manager.js" defer></script>
</body>
</html>
